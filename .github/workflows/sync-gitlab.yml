name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-gitlab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://MarcAragon:${GITLAB_TOKEN}@gitlab.com/MarcAragon/Asistente_agentico_UAO.git"
          git push gitlab HEAD:main