services:
  redis:
    image: redis:7-alpine
    container_name: asistente-uao-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: asistente-uao-api:latest
    container_name: asistente-uao-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UAO_RAG__REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: asistente-uao-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started

volumes:
  redis_data:
